name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed to validate PR commit messages

      - name: Set up project
        uses: ./.github/actions/setup-project

      - if: github.event_name == 'pull_request'
        name: Validate commit messages
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unused files and dependencies
        run: npm run check:deps

      - name: Translations
        run: npm run check:i18n

      - name: Dependency vulnerabilities (high and critical)
        run: npm audit --audit-level=high

      - name: Registry signatures and provenance
        run: npm audit signatures

  unit:
    name: Unit, component and story tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Chromium for browser-mode tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run Storybook story and accessibility tests
        run: npm run test:storybook

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  integration:
    name: Database, auth and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      # Local stack only (no hosted project or secrets). Services the app does not use are skipped.
      - name: Start local Supabase
        run: npx supabase start -x studio,postgres-meta,imgproxy,supavisor

      - name: RLS tests
        run: npm run test:rls

      - name: Drizzle queries respect RLS
        run: npm run test:db

      - name: Drizzle schema and migrations are in sync
        run: |
          npx drizzle-kit generate
          test -z "$(git status --porcelain supabase/migrations)"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: E2E and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
