name: Set up project
description: Install Node.js and npm dependencies, and create .env.local from .env.example

runs:
  using: composite
  steps:
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # .env.example holds the fixed local Supabase defaults; CI never uses hosted credentials.
    - name: Create .env.local
      shell: bash
      run: cp .env.example .env.local
